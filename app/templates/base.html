<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>{% block title %}SpoilerShield{% endblock %}</title>
    <link rel="stylesheet" href="/static/app.css">
    <script src="/static/app.js" defer></script>
</head>
<body class="{% block body_class %}{% endblock %}">
    <a class="skip-link" href="#main">跳到主要内容</a>

    <header class="site-header">
        <div class="wrap site-header__inner">
            <a class="brand" href="/" aria-label="SpoilerShield 首页">
                <svg class="brand__mark" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 3 5 6v5.2c0 4.4 3 7.5 7 8.8 4-1.3 7-4.4 7-8.8V6l-7-3Z"/>
                    <path d="M9.4 9.6h5.2M9.4 12.6h3.2"/>
                </svg>
                <span class="brand__name">SpoilerShield</span>
            </a>
            <nav class="site-nav" aria-label="主导航">
                <a href="/admin">审核后台</a>
            </nav>
        </div>
    </header>

    <main id="main" class="site-main {% block main_class %}{% endblock %}">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
