# 宝塔 Nginx 反向代理参考配置（textadventure.top）
#
# 推荐做法：
#   网站 → textadventure.top → 设置 → 反向代理 → 添加反向代理
#   目标 URL：http://127.0.0.1:8000
#   发送域名：$host
#   缓存：关闭
# 保存后点“配置文件”，确认/补充下面的 header 与超时。
#
# 注意：宝塔会自动生成 location / { proxy_pass ... }，以下片段仅供核对，
# 不要重复添加第二个 location /。

# 放在 server { } 内（全局请求体上限，需 ≥ 应用 MAX_UPLOAD_MB）
client_max_body_size 25m;

# 一本书的上传要解析 + 逐段 embedding；评论要等 LLM。都要给足时间。
proxy_connect_timeout 10s;
proxy_read_timeout 300s;
proxy_send_timeout 300s;

location / {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # 应用依赖这个头识别“请求经过了反向代理”，从而拒绝匿名后台
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 关闭缓存，避免登录态/评论列表被缓存
    proxy_buffering off;
}
