# SpoilerShield — Nginx reverse proxy sample.
# Put this in /etc/nginx/sites-available/spoilershield and symlink into
# sites-enabled. Replace books.example.com, then run:
#   sudo certbot --nginx -d books.example.com
# Certbot adds the 443 server block and the certificate automatically.

limit_req_zone $binary_remote_addr zone=spoilershield_comments:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=spoilershield_uploads:10m rate=6r/m;

upstream spoilershield {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name books.example.com;

    # Slightly above the app's MAX_UPLOAD_MB (20 MB).
    client_max_body_size 25m;

    # An upload parses + embeds a whole book in one request, and a comment waits
    # on the LLM. Both can legitimately take minutes on a small VPS.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 10s;
    proxy_request_buffering off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /static/ {
        proxy_pass http://spoilershield;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    location = /upload {
        limit_req zone=spoilershield_uploads burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://spoilershield;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /comment {
        limit_req zone=spoilershield_comments burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://spoilershield;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://spoilershield;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
