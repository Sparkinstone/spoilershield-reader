[pytest]
testpaths = tests
# The suite supplies its own tmp_path fixture (see tests/conftest.py): pytest's
# tmpdir plugin creates a 0700 base directory that the Windows sandbox can turn
# into an unreadable folder. The cache plugin is not needed either.
addopts = -p no:cacheprovider -p no:tmpdir
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
